name: Version Sync

on:
  workflow_dispatch:
  schedule:
    # Run once a week at 00:05 UTC on Friday.
    - cron: 5 0 * * 5

jobs:
  fetch-latest-versions:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: "Update the package manager versions"
        run: |
          set -euo pipefail

          LATEST_BERRY_VERSION=$(curl -s https://repo.yarnpkg.com/tags | jq -r '.latest.stable')

          LATEST_NPM=$(curl -s https://registry.npmjs.org/npm | jq -r '.["dist-tags"].latest + "+sha1." + .versions[.["dist-tags"].latest].dist.shasum')
          LATEST_PNPM=$(curl -s https://registry.npmjs.org/pnpm | jq -r '.["dist-tags"].latest + "+sha1." + .versions[.["dist-tags"].latest].dist.shasum')
          LATEST_YARN=$(curl -s https://registry.npmjs.org/yarn | jq -r '.["dist-tags"].latest + "+sha1." + .versions[.["dist-tags"].latest].dist.shasum')
          LATEST_BUN=$(curl -s  https://registry.npmjs.org/bun/latest | jq -r  '.version')
          BERRY_CHECKSUM=$(curl -s "https://repo.yarnpkg.com/${LATEST_BERRY_VERSION}/packages/yarnpkg-cli/bin/yarn.js" | openssl dgst -sha224 | awk '{print $2}')
          LATEST_BERRY="${LATEST_BERRY_VERSION}+sha224.${BERRY_CHECKSUM}"

          git --no-pager show HEAD:config.json \
            | jq --arg LATEST_NPM "$LATEST_NPM" \
                 --arg LATEST_PNPM "$LATEST_PNPM" \
                 --arg LATEST_YARN "$LATEST_YARN" \
                 --arg LATEST_BERRY "$LATEST_BERRY" \
                 --arg LATEST_BUN "$LATEST_BUN" \
                 '.definitions.npm.default = $LATEST_NPM
                  | .definitions.pnpm.default = $LATEST_PNPM
                  | .definitions.yarn.default = $LATEST_YARN
                  | .definitions.yarn.transparent.default = $LATEST_BERRY
                  | .definitions.bun.default = $LATEST_BUN' \
            > config.json.tmp

          # validate JSON
          jq -e . config.json.tmp >/dev/null

          # replace atomically
          mv config.json.tmp config.json

      - uses: gr2m/create-or-update-pull-request-action@77596e3166f328b24613f7082ab30bf2d93079d5 # v1.9.2
        # Creates a PR or update the Action's existing PR, or
        # no-op if the base branch is already up-to-date.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: This is an automated update of package manager versions
          branch: actions/tools-update-config.json
          commit-message: "feat: update package manager versions"
          title: "feat: update package manager versions"
